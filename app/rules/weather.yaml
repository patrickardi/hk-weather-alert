rules:
  - id: helper_black_rain
    safety_critical: true
    provenance: quote_only
    severity: danger
    title: 黑色暴雨 · 外佣留在室内
    body: 黑色暴雨警告生效时，应留在安全的室内，不要外出。如必须处理家务以外的紧急情况，先确保自身安全。
    source:
      quote: 黑色暴雨警告生效时，市民应留在安全的室内，避免外出及进入淹水地区。
      url: https://www.hko.gov.hk/tc/wservice/warning/rainstor.htm
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: helper_tc8plus
    safety_critical: true
    provenance: template
    severity: warning
    title: 八号或以上 · 外佣留在室内
    title_en: Signal 8 or above · stay indoors
    body: 八号或以上信号生效时，应留在安全的室内，不要外出。先确保自身安全。
    body_en: When Signal 8 or above is in force, stay indoors in a safe place. Do not go out. Keep yourself safe first.
    source:
      quote: >-
        In the event that tropical cyclone warning signal No.8 or above, landslip
        warning or red/black rainstorm warning is in force, the Home Affairs
        Department's Emergency Co-ordination Centre with the emergency hotline
        will be activated round-the-clock.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: pets_tc8plus
    safety_critical: true
    provenance: template
    severity: warning
    title: 八号或以上 · 看管宠物
    title_en: Signal 8 or above · keep pets indoors
    body: 把宠物留在室内。不要为了接宠物而外出。
    body_en: Keep pets indoors. Do not go out to fetch pets.
    source:
      quote: >-
        In the event that tropical cyclone warning signal No.8 or above, landslip
        warning or red/black rainstorm warning is in force, the Home Affairs
        Department's Emergency Co-ordination Centre with the emergency hotline
        will be activated round-the-clock.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: pets_black_rain
    safety_critical: true
    provenance: quote_only
    severity: danger
    title: 黑色暴雨 · 看管宠物
    body: 把宠物留在室内高处，不要放它们外出。不要为了接宠物而进入淹水或交通中断的地方。
    source:
      quote: 黑色暴雨警告生效时，市民应留在安全的室内，避免外出及进入淹水地区。
      url: https://www.hko.gov.hk/tc/wservice/warning/rainstor.htm
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: rooftop_landslip
    safety_critical: true
    provenance: quote_only
    severity: danger
    title: 山泥倾泻 · 天台屋
    body: 山泥倾泻警告生效时，斜坡附近及天台屋住户应远离危险斜坡，听从撤离指示。
    source:
      quote: 山泥倾泻警告生效时，市民应远离斜坡，留意政府的撤离安排。
      url: https://www.hko.gov.hk/tc/wservice/warning/landslip.htm
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: bedridden_black_rain
    safety_critical: true
    provenance: quote_only
    severity: danger
    title: 黑色暴雨 · 家中有卧床者
    body: 不要独自搬运卧床者涉水外出。先留在现时最安全的室内位置，需要协助时致电 999。
    source:
      quote: 黑色暴雨警告生效时，市民应留在安全的室内。如需紧急救援，请致电 999。
      url: https://www.hko.gov.hk/tc/wservice/warning/rainstor.htm
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: tc8_in_force
    safety_critical: true
    provenance: template
    severity: warning
    title: 八号热带气旋警告信号生效
    title_en: No. 8 signal is in force
    body: 八号信号生效。留在室内。远离窗户。不要外出。
    body_en: Signal No. 8 is in force. Stay indoors. Stay away from windows. Do not go out.
    source:
      quote: >-
        In the event that tropical cyclone warning signal No.8 or above, landslip
        warning or red/black rainstorm warning is in force, the Home Affairs
        Department's Emergency Co-ordination Centre with the emergency hotline
        will be activated round-the-clock.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: tc10_in_force
    safety_critical: true
    provenance: template
    severity: danger
    title: 十号飓风信号生效
    title_en: Hurricane Signal No. 10 is in force
    body: 十号飓风信号生效。这是最高级别。留在室内最安全的位置。远离窗户。不要外出。
    body_en: Hurricane Signal No. 10 is in force. This is the highest signal. Stay in the safest indoor place. Stay away from windows. Do not go out.
    source:
      quote: >-
        In the event that tropical cyclone warning signal No.8 or above, landslip
        warning or red/black rainstorm warning is in force, the Home Affairs
        Department's Emergency Co-ordination Centre with the emergency hotline
        will be activated round-the-clock.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: tc3_still_in_force
    safety_critical: true
    provenance: template
    severity: caution
    title: 三号强风信号仍生效
    title_en: Strong Wind Signal No. 3 is still in force
    body: 八号已经除下，三号强风信号仍生效。不是一切已过。仍须留意大风，减少非必要外出。
    body_en: Signal No. 8 has been cancelled. Signal No. 3 is still in force. This is not all-clear. Watch for strong winds and limit non-essential trips.
    source:
      quote: >-
        At time of emergencies, suitable temporary shelter(s) will be open as and
        when needed at the discretion of District Officer(s).
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: shelter_may_open
    safety_critical: true
    provenance: template
    severity: warning
    title: 临时庇护所（酌情开放）
    title_en: Temporary shelter (opened only if needed)
    body: 临时庇护所可能开放，请致电 1823 查询。本卡不显示地点，也不把任何地点写成开放中。
    body_en: Temporary shelters may open. Call 1823 to check. This card does not list locations and does not say any site is open.
    source:
      quote: >-
        At time of emergencies, suitable temporary shelter(s) will be open as and
        when needed at the discretion of District Officer(s) for providing
        temporary accommodation to evacuees and other displaced persons.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: rainstorm_level
    safety_critical: true
    provenance: quote_only
    severity: caution
    title: 暴雨警告
    body: 请留意最新暴雨警告，减少非必要外出。
    source:
      quote: 市民应留意最新的暴雨警告，采取适当防御措施。
      url: https://www.hko.gov.hk/tc/wservice/warning/rainstor.htm
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: no_active_warning_status
    safety_critical: false
    provenance: template
    severity: advisory
    title: 目前没有生效的天气警告
    body: 目前没有生效的天气警告。请继续留意天文台更新。此卡不覆盖劳工处工作热压力警告，也不覆盖未列入天文台警告摘要的酷热天气特别报告。
    source:
      quote: 现时并无生效的天气警告。
      url: https://www.hko.gov.hk/tc/warnsum/intro.htm
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: emergency_999
    safety_critical: true
    provenance: quote_only
    severity: danger
    title: 紧急求助
    title_en: Emergency
    body: 如遇紧急情况，请致电 999。
    body_en: In an emergency, call 999.
    source:
      quote: 如遇紧急情况，请致电 999。
      url: https://www.police.gov.hk/ppp_tc/contact_us.html
      label: 香港警务处
      retrieved_on: "2026-09-28"

  - id: emergency_sms_992
    safety_critical: true
    provenance: template
    severity: danger
    title: 紧急求助（传真 / 短讯）
    title_en: Emergency SMS / fax
    body: 听障或语障人士如需紧急求助，请使用 992 传真或短讯。
    body_en: If you cannot use voice calls, use 992 by SMS or fax.
    source:
      quote: Emergency, hearing/speech impaired (fax/SMS) 992
      url: https://www.sb.gov.hk/
      label: 保安局 Simple Guidelines in the Event of Major Mishaps
      retrieved_on: "2026-09-28"

  - id: where_to_ask
    safety_critical: false
    provenance: template
    severity: advisory
    title: 查询热线
    title_en: Enquiry
    body: 非紧急查询可致电 1823。临时庇护所是否开放由民政事务专员酌情决定，本卡不会把任何地点写成开放中。
    body_en: For non-emergency questions, call 1823. Temporary shelters open only at the District Officer's discretion.
    source:
      quote: At time of emergencies, suitable temporary shelter(s) will be open as and when needed at the discretion of District Officer(s).
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-09-28"

  - id: abstain_out_of_scope
    safety_critical: false
    provenance: template
    severity: advisory
    title: 超出研究范围
    body: 该地址不在本卡覆盖的香港十八区范围内。
    source:
      quote: 本服务覆盖香港十八区。
      url: https://www.had.gov.hk/
      label: 民政事务总署
      retrieved_on: "2026-09-28"

  - id: abstain_incomplete_data
    safety_critical: false
    provenance: template
    severity: advisory
    title: 数据不完整
    body: 输入或上游天气数据不完整，不足以判断你所在位置的情况。
    source:
      quote: 数据不完整时不应给出情境化行动建议。
      url: https://www.hko.gov.hk/
      label: 香港天文台
      retrieved_on: "2026-09-28"

  - id: abstain_source_disagreement
    safety_critical: false
    provenance: template
    severity: advisory
    title: 上游数据不一致
    body: 天文台警告摘要与分区天气报告不一致，无法判断当前警告。
    source:
      quote: An empty warnsum body is indistinguishable from a broken upstream.
      url: https://www.hko.gov.hk/
      label: 香港天文台
      retrieved_on: "2026-09-28"

contacts:
  - id: contact_had_round_the_clock
    mode: had_round_the_clock
    codes: [WRAINR, WRAINB, WL]
    types: [TC8NE, TC8SE, TC8NW, TC8SW, TC9, TC10]
    had_hotline: "2572 8427"
    had_hours: "24小时"
    enquiry: "1823"
    source:
      quote: >-
        In the event that tropical cyclone warning signal No.8 or above, landslip
        warning or red/black rainstorm warning is in force, the Home Affairs
        Department's Emergency Co-ordination Centre with the emergency hotline
        will be activated round-the-clock to answer relevant enquiries.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: contact_had_until_midnight
    mode: had_until_midnight
    codes: [WHOT]
    had_hotline: "2572 8427"
    had_hours: "午夜前"
    enquiry: "1823"
    source:
      quote: please call the department's hotline before midnight on 2572 8427
      url: https://www.info.gov.hk/gia/general/202609/29/P2026092900557.htm
      label: 政府新闻公报
      retrieved_on: "2026-09-29"

  - id: contact_cold_shelter
    mode: had_office_hours
    codes: [WCOLD]
    had_hotline: "2835 2500"
    had_hours: "办公时间"
    enquiry: "1823"
    source:
      quote: >-
        We also open temporary cold shelters during cold spells to people who
        need to take refuge from cold. For more information, please call our
        Telephone Enquiry Centre at 2835 2500 during office hours.
      url: https://www.had.gov.hk/en/public_services/emergency_services/emergency.htm
      label: 民政事务总署
      retrieved_on: "2026-10-12"

  - id: contact_1823
    mode: gov_1823
    default: true
    enquiry: "1823"
    source:
      quote: 1823 provides 24-hour government enquiry service.
      url: https://www.1823.gov.hk/
      label: "1823"
      retrieved_on: "2026-09-28"
